# =============================================================================
# 静态站点缓存策略
#
# 由 deploy.sh 自动同步到服务器：/etc/nginx/default.d/cache.conf
# 该目录被站点 server 块中的 `include /etc/nginx/default.d/*.conf;` 引入，
# 因此下面的指令等效于 server 级配置，会继承给未单独设置 add_header 的 location。
#
# 效果：
#   - 浏览器每次访问都会回服务器做一次「协商缓存」校验；
#   - 内容未变 → 返回 304 Not Modified（响应体仅几十字节，开销极小）；
#   - 内容已变 → 立即返回最新内容。
#
# 由此 HTML 里不再需要手工维护 ?v=1.1.3 这类版本号：
# 改完代码直接部署，用户下次打开即是最新内容。
# =============================================================================

# 开启 ETag：配合 Last-Modified，让 nginx 能正确处理
# If-None-Match / If-Modified-Since 并返回 304
etag on;

# 所有响应在使用本地缓存前都必须重新验证。
# （用 no-cache 而非 no-store：no-store 会完全禁止缓存、每次全量重传，过于浪费）
add_header Cache-Control "no-cache";
