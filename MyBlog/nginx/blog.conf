# =============================================================================
# 站点 HTTP(80) server 块
#
# 本文件由仓库统一管理，deploy.sh 会自动同步到服务器 /etc/nginx/conf.d/blog.conf
#（同步前先 nginx -t 校验，失败会自动回滚）。
#
# 说明：HTTPS(443) 的 server 块位于 /etc/nginx/nginx.conf，
#      其缓存策略由仓库 nginx/cache.conf 经 /etc/nginx/default.d/ 引入，
#      与本文件保持一致，均为「协商缓存」。
# =============================================================================
server {
    listen 80;
    server_name 47.110.38.26;  # 你的服务器IP

    root /usr/share/nginx/html;
    index index.html;

    # 单页路由回退：找不到对应文件时回退到首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 全站协商缓存：浏览器每次使用本地缓存前都回服务器验证，
    # 未变更返回 304，变更后立即拿到最新内容（配合下方 etag 生效）。
    # 注意：不要再使用 expires 1y / immutable —— 那会让 js、css 长期拿不到更新。
    etag on;
    add_header Cache-Control "no-cache";

    # right-sidebar.html 需要实时反映统计数据，显式禁止任何缓存
    location = /components/right-sidebar.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT";
    }
}
