<!DOCTYPE html>
<html class="scroll-smooth" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=0.5, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes"
        name="viewport" />
    <title>文章详情 | TechEditorial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../css/style.css" />

    <!-- 语法高亮：MicroLighter v2.2.0（本地部署，无 CDN / 零运行时依赖） -->
    <link rel="stylesheet" href="../js/vendor/microlighter/themes/github.css" />
    <script type="module" src="../js/vendor/microlighter/microlighter.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        // 语义色统一走 CSS 变量（见 css/style.css 的 :root / html.dark），
                        // 用 rgb(... / <alpha-value>) 以保留 /20 之类的透明度修饰符。
                        "tertiary-fixed-dim": "rgb(var(--c-tertiary-fixed-dim) / <alpha-value>)",
                        "surface-tint": "rgb(var(--c-surface-tint) / <alpha-value>)",
                        "on-primary-container": "rgb(var(--c-on-primary-container) / <alpha-value>)",
                        "surface-dim": "rgb(var(--c-surface-dim) / <alpha-value>)",
                        "on-primary-fixed": "rgb(var(--c-on-primary-fixed) / <alpha-value>)",
                        "on-tertiary-fixed": "rgb(var(--c-on-tertiary-fixed) / <alpha-value>)",
                        "background": "rgb(var(--c-background) / <alpha-value>)",
                        "tertiary": "rgb(var(--c-tertiary) / <alpha-value>)",
                        "surface-bright": "rgb(var(--c-surface-bright) / <alpha-value>)",
                        "secondary-fixed-dim": "rgb(var(--c-secondary-fixed-dim) / <alpha-value>)",
                        "surface-container-highest": "rgb(var(--c-surface-container-highest) / <alpha-value>)",
                        "secondary-fixed": "rgb(var(--c-secondary-fixed) / <alpha-value>)",
                        "outline": "rgb(var(--c-outline) / <alpha-value>)",
                        "error-container": "rgb(var(--c-error-container) / <alpha-value>)",
                        "on-tertiary": "rgb(var(--c-on-tertiary) / <alpha-value>)",
                        "error": "rgb(var(--c-error) / <alpha-value>)",
                        "on-secondary-fixed": "rgb(var(--c-on-secondary-fixed) / <alpha-value>)",
                        "primary-fixed-dim": "rgb(var(--c-primary-fixed-dim) / <alpha-value>)",
                        "on-primary": "rgb(var(--c-on-primary) / <alpha-value>)",
                        "tertiary-fixed": "rgb(var(--c-tertiary-fixed) / <alpha-value>)",
                        "secondary": "rgb(var(--c-secondary) / <alpha-value>)",
                        "on-surface": "rgb(var(--c-on-surface) / <alpha-value>)",
                        "surface-variant": "rgb(var(--c-surface-variant) / <alpha-value>)",
                        "surface": "rgb(var(--c-surface) / <alpha-value>)",
                        "primary": "rgb(var(--c-primary) / <alpha-value>)",
                        "on-secondary-fixed-variant": "rgb(var(--c-on-secondary-fixed-variant) / <alpha-value>)",
                        "on-surface-variant": "rgb(var(--c-on-surface-variant) / <alpha-value>)",
                        "tertiary-container": "rgb(var(--c-tertiary-container) / <alpha-value>)",
                        "on-secondary-container": "rgb(var(--c-on-secondary-container) / <alpha-value>)",
                        "inverse-primary": "rgb(var(--c-inverse-primary) / <alpha-value>)",
                        "surface-container-low": "rgb(var(--c-surface-container-low) / <alpha-value>)",
                        "on-tertiary-fixed-variant": "rgb(var(--c-on-tertiary-fixed-variant) / <alpha-value>)",
                        "surface-container-lowest": "rgb(var(--c-surface-container-lowest) / <alpha-value>)",
                        "outline-variant": "rgb(var(--c-outline-variant) / <alpha-value>)",
                        "secondary-container": "rgb(var(--c-secondary-container) / <alpha-value>)",
                        "inverse-surface": "rgb(var(--c-inverse-surface) / <alpha-value>)",
                        "on-tertiary-container": "rgb(var(--c-on-tertiary-container) / <alpha-value>)",
                        "primary-fixed": "rgb(var(--c-primary-fixed) / <alpha-value>)",
                        "on-background": "rgb(var(--c-on-background) / <alpha-value>)",
                        "primary-container": "rgb(var(--c-primary-container) / <alpha-value>)",
                        "inverse-on-surface": "rgb(var(--c-inverse-on-surface) / <alpha-value>)",
                        "on-primary-fixed-variant": "rgb(var(--c-on-primary-fixed-variant) / <alpha-value>)",
                        "surface-container-high": "rgb(var(--c-surface-container-high) / <alpha-value>)",
                        "surface-container": "rgb(var(--c-surface-container) / <alpha-value>)",
                        "on-error": "rgb(var(--c-on-error) / <alpha-value>)",
                        "on-error-container": "rgb(var(--c-on-error-container) / <alpha-value>)",
                        "on-secondary": "rgb(var(--c-on-secondary) / <alpha-value>)"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                        "body": ["Manrope", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                        "label": ["Inter", "PingFang SC", "Microsoft YaHei", "sans-serif"],
                        "mono": ["Fira Code", "ui-monospace", "SFMono-Regular"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* 标题样式 - 颜色跟随主题令牌（浅色≈#191c1e，灰色≈#e6e6e8），无需再写 .dark 覆盖 */
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4,
        .article-content h5,
        .article-content h6 {
            margin-top: 1.5em;
            margin-bottom: 1em;
            color: rgb(var(--c-on-surface));
            font-weight: 600;
            line-height: 1.3;
        }

        .article-content h1 {
            font-size: 2rem;
            line-height: 1.2;
            font-weight: 700;
        }

        .article-content h2 {
            font-size: 1.5rem;
        }

        .article-content h3 {
            font-size: 1.25rem;
        }

        .article-content h4 {
            font-size: 1.125rem;
        }

        .article-content h5 {
            font-size: 1rem;
        }

        .article-content h6 {
            font-size: 0.9rem;
            color: rgb(var(--c-on-surface-variant));
        }

        .article-content p {
            margin-bottom: 1em;
            line-height: 1.8;
        }

        /* 列表样式 */
        .article-content ul,
        .article-content ol {
            margin: 1.5em 0;
            padding-left: 1.5em;
        }

        .article-content li {
            margin: 0.5em 0;
            line-height: 1.6;
        }

        .article-content ul {
            list-style-type: disc;
        }

        .article-content ol {
            list-style-type: decimal;
        }

        .article-content ul ul,
        .article-content ol ul {
            list-style-type: circle;
        }

        .article-content ol ol,
        .article-content ul ol {
            list-style-type: lower-alpha;
        }

        .article-content img {
            margin: 1.5em 0;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        /* 链接 / 行内代码 / 引用 / 分割线 / 表格 —— 让 Markdown 常见元素都有主题化外观 */
        .article-content a {
            color: rgb(var(--c-primary));
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .article-content a:hover {
            opacity: 0.8;
        }

        .article-content :not(pre)>code {
            background-color: rgb(var(--c-surface-container-high));
            color: rgb(var(--c-on-surface));
            padding: 0.15em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }

        .article-content blockquote {
            margin: 1.5em 0;
            padding: 0.5em 1.25em;
            border-left: 3px solid rgb(var(--c-primary));
            background-color: rgb(var(--c-surface-container-low));
            color: rgb(var(--c-on-surface-variant));
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .article-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .article-content hr {
            margin: 2.5em 0;
            border: 0;
            border-top: 1px solid rgb(var(--c-outline-variant));
        }

        .article-content table {
            width: 100%;
            margin: 1.5em 0;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .article-content th,
        .article-content td {
            border: 1px solid rgb(var(--c-outline-variant) / 0.6);
            padding: 0.6em 0.9em;
            text-align: left;
        }

        .article-content thead th {
            background-color: rgb(var(--c-surface-container-high));
            color: rgb(var(--c-on-surface));
            font-weight: 600;
        }

        .article-content tbody tr:nth-child(even) {
            background-color: rgb(var(--c-surface-container-low));
        }

        .article-content strong {
            font-weight: 700;
            color: rgb(var(--c-on-surface));
        }

        /* 代码块外观交给 MicroLighter 主题变量控制，这里只负责排版 */
        .article-content pre {
            background-color: var(--syntax-background, #f0f2f5);
            color: var(--syntax-foreground, inherit);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1.5em 0;
        }

        .dark .article-content pre {
            background-color: var(--syntax-background, #111827);
            color: var(--syntax-foreground, inherit);
        }

        .article-content code {
            font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        /* 代码块高亮配色：跟随本站 .dark 切换。
           注意：::highlight() 中不解析 light-dark()，所以这里必须直接给出明/暗两套纯色变量，
           不能依赖主题自带的 light-dark() 写法（否则代码块只会渲染成单一颜色）。 */
        [data-syntax-theme="github"] {
            color-scheme: light;
            --syntax-background: #ffffff;
            --syntax-foreground: #24292f;
            --syntax-comment: #6e7781;
            --syntax-keyword: #cf222e;
            --syntax-operator: #24292f;
            --syntax-string: #0a3069;
            --syntax-constant: #0550ae;
            --syntax-function: #8250df;
            --syntax-type: #8250df;
            --syntax-variable: #953800;
            --syntax-property: #0550ae;
            --syntax-tag: #116329;
            --syntax-selector: #8250df;
            --syntax-inserted: #116329;
            --syntax-deleted: #cf222e;
        }

        html.dark [data-syntax-theme="github"] {
            color-scheme: dark;
            --syntax-background: #1e1e20;
            --syntax-foreground: #e6e6e8;
            --syntax-comment: #8b949e;
            --syntax-keyword: #ff7b72;
            --syntax-operator: #c9d1d9;
            --syntax-string: #a5d6ff;
            --syntax-constant: #79c0ff;
            --syntax-function: #d2a8ff;
            --syntax-type: #d2a8ff;
            --syntax-variable: #ffa657;
            --syntax-property: #79c0ff;
            --syntax-tag: #7ee787;
            --syntax-selector: #d2a8ff;
            --syntax-inserted: #7ee787;
            --syntax-deleted: #ff7b72;
        }

        /* ========== 移动端适配：消除内容容器 30% 左右留白 ========== */
        @media (max-width: 768px) {
            .article-container {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
        }
    </style>
    <script src="../js/layout-init.js"></script>
    <script>
        // 文章详情页处在 /articles 子目录：组件路径与站内相对链接都需要回退一层
        initLayout({
            componentsBasePath: '../components',
            linkBasePrefix: '..'
        });
    </script>
</head>

<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="header-placeholder"></div>

    <div class="flex min-h-screen pt-16">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 px-4 sm:px-8 py-12 flex flex-col xl:flex-row relative">
            <!-- 主内容容器：添加 article-container 类用于移动端覆盖 -->
            <div class="w-full px-[20%] box-border article-container">
                <article class="max-w-full mx-auto w-full">
                    <header class="mb-8">
                        <div
                            class="flex items-center gap-3 text-xs font-label text-primary font-bold tracking-widest uppercase mb-4">
                            <span class="category-tag"></span>
                            <span class="w-1 h-1 bg-outline-variant rounded-full"></span>
                            <span class="text-on-surface-variant font-medium publish-date"></span>
                        </div>

                        <h1 class="text-4xl font-headline font-bold text-on-surface mb-4 article-title"></h1>

                        <div class="flex items-center gap-4 pt-4 border-t border-outline-variant/20">
                            <div class="flex items-center gap-2">
                                <img class="w-8 h-8 rounded-full author-avatar" src="" alt="作者头像" />
                                <span class="text-sm font-medium text-on-surface author-name"></span>
                            </div>
                            <span class="text-sm text-outline font-label read-time"></span>
                        </div>
                    </header>

                    <div id="article-content" data-syntax-theme="github" class="article-content text-on-surface-variant"></div>

                    <footer class="mt-12 pt-8 border-t border-outline-variant/20">
                        <div class="flex flex-wrap gap-2 tags-section"></div>

                        <div class="mt-8 flex justify-between items-center">
                            <div class="flex gap-4 social-actions">
                                <button
                                    class="p-2 hover:bg-surface-container-low rounded-full transition-colors like-btn"
                                    type="button">
                                    <span class="material-symbols-outlined text-on-surface-variant">favorite</span>
                                </button>
                                <button
                                    class="p-2 hover:bg-surface-container-low rounded-full transition-colors share-btn"
                                    type="button">
                                    <span class="material-symbols-outlined text-on-surface-variant">share</span>
                                </button>
                            </div>
                            <div class="text-sm text-on-surface-variant last-updated"></div>
                        </div>
                    </footer>
                </article>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>
    
    <!-- 图片放大模态框 -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden items-center justify-center p-4">
        <span class="absolute top-4 right-6 text-white text-4xl font-bold cursor-pointer" id="modal-close">&times;</span>
        <img class="max-w-[90vw] max-h-[90vh] object-contain" id="modal-image" src="" alt="放大的图片">
    </div>

    <div id="footer-placeholder"></div>
    <script src="../js/articles-data.js?v=1.1.3"></script>
    <script src="../js/main.js?v=1.1.3"></script>
    <script src="../js/article-detail.js?v=1.1.3"></script>
</body>

</html>
