<!DOCTYPE html>
<html class="scroll-smooth" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=0.5, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes"
        name="viewport" />
    <title>文章详情 | TechEditorial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../css/style.css" />

    <!-- 语法高亮：MicroLighter v2.2.0（本地部署，无 CDN / 零运行时依赖） -->
    <link rel="stylesheet" href="../js/vendor/microlighter/themes/github.css" />
    <script type="module" src="../js/vendor/microlighter/microlighter.min.js"></script>

    <!-- Tailwind 配置统一走公共文件，避免各页面各写一份导致漂移 -->
    <script src="../js/tailwind-config.js"></script>

    <!-- 脚本启动入口：公共脚本顺序统一在 js/bootstrap.js 中管理；本页位于子目录，需回退一层 -->
    <script src="../js/bootstrap.js" data-components="../components" data-link-prefix=".."
        data-modules="article-detail"></script>
</head>

<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="header-placeholder"></div>

    <div class="flex min-h-screen pt-16">
        <div id="sidebar-placeholder"></div>

        <main class="flex-1 px-4 sm:px-8 py-12 flex flex-col xl:flex-row relative">
            <!-- 主内容容器：添加 article-container 类用于移动端覆盖 -->
            <div class="w-full px-[20%] box-border article-container">
                <article class="max-w-full mx-auto w-full">
                    <header class="mb-8">
                        <div
                            class="flex items-center gap-3 text-xs font-label text-primary font-bold tracking-widest uppercase mb-4">
                            <span class="category-tag"></span>
                            <span class="w-1 h-1 bg-outline-variant rounded-full"></span>
                            <span class="text-on-surface-variant font-medium publish-date"></span>
                        </div>

                        <h1 class="text-4xl font-headline font-bold text-on-surface mb-4 article-title"></h1>

                        <div class="flex items-center gap-4 pt-4 border-t border-outline-variant/20">
                            <div class="flex items-center gap-2">
                                <img class="w-8 h-8 rounded-full author-avatar" src="" alt="作者头像" />
                                <span class="text-sm font-medium text-on-surface author-name"></span>
                            </div>
                            <span class="text-sm text-outline font-label read-time"></span>
                        </div>
                    </header>

                    <div id="article-content" data-syntax-theme="github" class="article-content text-on-surface-variant"></div>

                    <footer class="mt-12 pt-8 border-t border-outline-variant/20">
                        <div class="flex flex-wrap gap-2 tags-section"></div>

                        <div class="mt-8 flex justify-between items-center">
                            <div class="flex gap-4 social-actions">
                                <button
                                    class="p-2 hover:bg-surface-container-low rounded-full transition-colors like-btn"
                                    type="button">
                                    <span class="material-symbols-outlined text-on-surface-variant">favorite</span>
                                </button>
                                <button
                                    class="p-2 hover:bg-surface-container-low rounded-full transition-colors share-btn"
                                    type="button">
                                    <span class="material-symbols-outlined text-on-surface-variant">share</span>
                                </button>
                            </div>
                            <div class="text-sm text-on-surface-variant last-updated"></div>
                        </div>
                    </footer>
                </article>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <!-- 图片放大模态框 -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden items-center justify-center p-4">
        <span class="absolute top-4 right-6 text-white text-4xl font-bold cursor-pointer" id="modal-close">&times;</span>
        <img class="max-w-[90vw] max-h-[90vh] object-contain" id="modal-image" src="" alt="放大的图片">
    </div>
</body>

</html>
