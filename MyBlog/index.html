<!DOCTYPE html>
<html class="scroll-smooth" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" name="viewport" />
    <title>TechEditorial | 物联网/嵌入式</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/tailwind-config.js"></script>

    <!-- 脚本启动入口：公共脚本顺序与页面配置统一在 js/bootstrap.js 中管理 -->
    <script src="js/bootstrap.js" data-modules="baidu-analytics"></script>

</head>

<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">
    <!-- TopNavBar -->
    <div id="header-placeholder"></div>

    <div class="flex min-h-screen pt-16">
        <!-- SideNavBar -->
        <div id="sidebar-placeholder"></div>
        <!-- Main Content Area -->
        <main class="flex-1 ml-0 lg:ml-0 px-4 sm:px-8 py-12 flex flex-col xl:flex-row">
            <!-- 主内容容器：添加 category-main-container 类用于移动端覆盖 -->
            <div class="w-full max-w-full ml-0 pr-0 space-y-16 sm:space-y-24 lg:max-w-[40vw] lg:ml-[20vw] category-main-container">
                <!-- Hero Section -->
                <!-- <section class="space-y-6">
                    <h1
                        class="text-4xl sm:text-6xl font-headline font-bold text-on-surface tracking-tighter leading-tight">
                        重塑数字 <span class="text-primary">基石</span>
                    </h1>
                    <p class="text-xl text-on-surface-variant font-body leading-relaxed max-w-2xl">
                        深入探讨底层系统、优雅的 UI 架构以及软硬件的交汇点. 为现代工程师提供的密集的硬核知识.
                    </p>
                </section> -->
                <!-- Blog List -->
                <div class="space-y-12 sm:space-y-16">
                    <!-- 文章列表将通过JavaScript动态生成 -->
                </div>
                <!-- Pagination/Load More -->
                <div class="pt-12 flex justify-center">
                    <button
                        class="px-6 sm:px-8 py-3 bg-surface-container-lowest text-on-surface font-headline font-bold text-sm tracking-widest border border-outline-variant/10 rounded-full hover:bg-primary hover:text-on-primary transition-all duration-300 shadow-sm">
                        加载历史存档
                    </button>
                </div>
            </div>
            <!-- Right Sidebar - Blog Info & Trends -->
            <div class="right-sidebar-placeholder"></div>
        </main>
    </div>
    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <!-- FAB -->
    <button
        class="fixed bottom-8 right-8 w-14 h-14 bg-primary text-on-primary rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all z-50 lg:hidden">
        <span class="material-symbols-outlined">edit</span>
    </button>
</body>

</html>
